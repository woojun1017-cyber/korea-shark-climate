<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>기후변화가 상어를 어디까지 올라가게 할까?</title>
    
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <!-- Leaflet GIS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-base: #0B1120;
            --bg-panel: #131E32;
            --bg-card: #182640;
            --border: #233554;
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --accent-cyan: #38BDF8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            flex-shrink: 0;
            gap: 12px;
        }
        .brand h1 {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38BDF8, #F87171);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }
        .brand p {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Simulator Controllers */
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .ctrl-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        select {
            background: #0F172A;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }
        select:focus { border-color: var(--accent-cyan); }

        /* Map Viewport */
        #map-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 0;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #070B14;
        }

        /* Floating Info Box */
        .info-card {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 999;
            background: rgba(19, 30, 50, 0.92);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            max-width: 280px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
        .info-title {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .info-species {
            font-size: 1rem;
            font-weight: 800;
            color: #FFF;
            margin: 2px 0 6px 0;
        }
        .info-desc {
            font-size: 0.72rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Legend */
        .legend-card {
            position: absolute;
            bottom: 18px;
            right: 14px;
            z-index: 999;
            background: rgba(19, 30, 50, 0.92);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.75rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .legend-title {
            font-weight: 700;
            margin-bottom: 4px;
            color: #F8FAFC;
            font-size: 0.72rem;
        }
        .legend-gradient {
            width: 150px;
            height: 10px;
            border-radius: 3px;
            background: linear-gradient(to right, rgba(0,0,0,0) 0%, #3B82F6 20%, #F59E0B 50%, #EF4444 80%, #990000 100%);
            margin-bottom: 4px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.68rem;
        }

        /* =====================================================================
           모바일 전용 반응형 스타일 (화면 너비 768px 이하)
           ===================================================================== */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: stretch;
                padding: 10px 14px;
                gap: 8px;
            }
            .brand h1 { font-size: 1.0rem; text-align: center; }
            .brand p { display: none; } /* 모바일에서는 부제목 생략으로 지도 공간 확보 */

            .controls {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 6px;
                padding: 6px 8px;
                width: 100%;
            }
            .ctrl-group {
                flex-direction: column;
                align-items: stretch;
                gap: 2px;
            }
            .ctrl-group label {
                font-size: 0.68rem;
            }
            select {
                width: 100%;
                padding: 4px 6px;
                font-size: 0.72rem;
            }

            /* 모바일에서 정보창은 화면 하단 가로 배너로 축소 이동 */
            .info-card {
                top: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
                padding: 8px 12px;
                background: rgba(19, 30, 50, 0.95);
            }
            .info-desc { display: none; } /* 긴 설명 숨김 */
            .info-species { font-size: 0.88rem; margin: 0; }

            /* 범례는 모바일 우측 하단에 작게 고정 */
            .legend-card {
                bottom: 12px;
                right: 10px;
                padding: 8px 10px;
            }
            .legend-gradient { width: 120px; height: 8px; }
            .legend-title { font-size: 0.65rem; }
            .legend-labels { font-size: 0.62rem; }
        }
    </style>
</head>
<body>

    <!-- Header Controls -->
    <header>
        <div class="brand">
            <h1>기후변화가 상어를 어디까지 올라가게 할까?</h1>
            <p>500m 고해상도 SDM 앙상블 기반 한반도 연안 출현 위험 시뮬레이터</p>
        </div>

        <div class="controls">
            <div class="ctrl-group">
                <label>어종:</label>
                <select id="speciesSelect">
                    <option value="Carcharhinus brachyurus">무태상어</option>
                    <option value="Isurus oxyrinchus">청상아리</option>
                    <option value="Prionace glauca">청새리상어</option>
                </select>
            </div>

            <div class="ctrl-group">
                <label>시나리오:</label>
                <select id="sspSelect">
                    <option value="SSP5-8.5">SSP5-8.5 (고탄소)</option>
                    <option value="SSP1-2.6">SSP1-2.6 (감축)</option>
                    <option value="Present">Present (현재)</option>
                </select>
            </div>

            <div class="ctrl-group">
                <label>연도:</label>
                <select id="yearSelect">
                    <option value="2050s">2050년대</option>
                    <option value="2100s">2100년대</option>
                    <option value="Present">현재</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Map Viewport -->
    <div id="map-container">
        <div id="map"></div>

        <!-- Floating Info Box -->
        <div class="info-card">
            <div class="info-title">선택된 예측 조건</div>
            <div class="info-species" id="speciesLabel">-</div>
            <div class="info-desc">
                • 붉은색 영역이 짙을수록 서식 적합도(HSI)가 높습니다.
            </div>
        </div>

        <!-- Legend -->
        <div class="legend-card">
            <div class="legend-title">서식 적합도 (HSI)</div>
            <div class="legend-gradient"></div>
            <div class="legend-labels">
                <span>안전</span>
                <span>보통</span>
                <span>위험</span>
            </div>
        </div>
    </div>

    <script>
        let dbData = null;
        let map;
        let currentOverlay = null;

        // 모바일 화면 비율에 맞춰 줌 레벨 자동 조정
        const isMobile = window.innerWidth <= 768;
        const initialZoom = isMobile ? 6 : 7;
        const initialCenter = isMobile ? [36.0, 127.8] : [36.2, 128.5];

        map = L.map('map', {
            center: initialCenter,
            zoom: initialZoom,
            minZoom: 5,
            maxZoom: 11,
            zoomControl: !isMobile // 모바일에서는 손가락 핀치 줌 사용하므로 +/- 버튼 숨김
        });

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        fetch('frontier_dashboard_data.json')
            .then(res => {
                if(!res.ok) throw new Error("JSON 파일을 찾을 수 없습니다.");
                return res.json();
            })
            .then(data => {
                dbData = data;
                initEvents();
                updateLayer();
            })
            .catch(err => {
                console.error("데이터 로드 실패:", err);
            });

        function initEvents() {
            document.getElementById('speciesSelect').addEventListener('change', updateLayer);
            document.getElementById('sspSelect').addEventListener('change', onScenarioChange);
            document.getElementById('yearSelect').addEventListener('change', updateLayer);
        }

        function onScenarioChange() {
            const ssp = document.getElementById('sspSelect').value;
            const yearSel = document.getElementById('yearSelect');
            if (ssp === 'Present') {
                yearSel.value = 'Present';
                yearSel.disabled = true;
            } else {
                yearSel.disabled = false;
                if (yearSel.value === 'Present') yearSel.value = '2050s';
            }
            updateLayer();
        }

        function updateLayer() {
            if (!dbData) return;

            const sp = document.getElementById('speciesSelect').value;
            let ssp = document.getElementById('sspSelect').value;
            let yr = document.getElementById('yearSelect').value;

            if (ssp === 'Present' || yr === 'Present') {
                ssp = 'Present';
                yr = 'Present';
            }

            const condKey = `${ssp}_${yr}`;
            const condData = dbData.conditions[sp][condKey];
            if (!condData) return;

            const spNames = {
                "Carcharhinus brachyurus": "무태상어",
                "Isurus oxyrinchus": "청상아리",
                "Prionace glauca": "청새리상어"
            };
            document.getElementById('speciesLabel').innerText = `${spNames[sp]} | ${ssp} (${yr})`;

            // 기존 오버레이 제거
            if (currentOverlay) {
                map.removeLayer(currentOverlay);
            }
            
            // Base64 내장 데이터를 우선 사용 (경로 에러 및 물음표 원천 차단)
            const imgSrc = condData.image_data || condData.image_url;

            currentOverlay = L.imageOverlay(imgSrc, dbData.bounds, {
                opacity: 0.85,
                interactive: false
            }).addTo(map);
        }
    </script>
</body>
</html>
